<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>OK Icon Library</title>
    <meta name="description" content="Download and use various font icons easily.">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="style.svg.css">
</head>
<body>
    <header>
        <h1>OK Icon Library</h1>
        <p>Simple Icons using CCS.... ONLY CSS.</p>
    </header>

    <main>
        <section>
            <h2>View and Control Icons</h2>
            <div class="icon-grid">
                <!-- Eye Icon -->
                <div class="ic ic-eye">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M12 4C7 4 2.73 8.11 1 12c1.73 3.89 6 8 11 8s9.27-4.11 11-8c-1.73-3.89-6-8-11-8zm0 14c-3.87 0-7.19-3.13-8.56-6 1.36-2.87 4.69-6 8.56-6s7.19 3.13 8.56 6c-1.36 2.87-4.69 6-8.56 6z"/>
                        <circle cx="12" cy="12" r="3"/>
                    </svg>
                </div>
                <!-- Lightning Bolt Icon -->
                <div class="ic ic-lightning">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M13 2L3 14h8l-2 8 10-12h-8l2-8z"/>
                    </svg>
                </div>
                <!-- Pencil Icon -->
                <div class="ic ic-pencil">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M3 21v-3.34l10.58-10.59 3.34 3.34L6.34 21H3zm3.34-3.34L16 8l-1.34-1.34-9.32 9.32v1.34h1.34z"/>
                    </svg>
                </div>
                <!-- Hamburger Menu Icon -->
                <div class="ic ic-hamburger">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z"/>
                    </svg>
                </div>
                <!-- Expand Fullscreen Icon -->
                <div class="ic ic-expand">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M3 3h6V1H1v8h2V3zm18 0v6h2V1h-8v2h6zM3 21h6v2H1v-8h2v6zm18-6v6h-6v2h8v-8h-2z"/>
                    </svg>
                </div>
            </div>            
        </section>

        <section>
            <h2>Media Control Icons</h2>
            <div class="icon-grid">
                <!-- Play Icon -->
                <div class="ic ic-play">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M8 5v14l11-7z"/>
                    </svg>
                </div>
                <!-- Pause Icon -->
                <div class="ic ic-pause">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M6 5h4v14H6zM14 5h4v14h-4z"/>
                    </svg>
                </div>
                <!-- Stop Icon -->
                <div class="ic ic-stop">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M6 6h12v12H6z"/>
                    </svg>
                </div>
                <!-- Skip Icon -->
                <div class="ic ic-skip">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M4 4v16l12-8zm16 0h-2v16h2z"/>
                    </svg>
                </div>
                <!-- Fast Forward Icon -->
                <div class="ic ic-fastforward">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M4 4v16l8-8zm8 0v16l8-8z"/>
                    </svg>
                </div>
            </div>            
        </section>

        <section>
            <h2>Status and Notification Icons</h2>
            <div class="icon-grid">
                <!-- Check Icon -->
                <div class="ic ic-check">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M9 16.2L4.8 12l-1.4 1.4L9 19 21 7l-1.4-1.4z"/>
                    </svg>
                </div>
                <!-- Circle Check Icon -->
                <div class="ic ic-circle-check">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14l-4-4 1.41-1.41L10 13.17l7.59-7.59L19 7l-9 9z"/>
                    </svg>
                </div>
                <!-- Error Icon -->
                <div class="ic ic-error">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                    </svg>
                </div>
                <!-- Circle Error Icon -->
                <div class="ic ic-circle-error">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 14h2v2h-2zm0-10h2v8h-2z"/>
                    </svg>
                </div>
                <!-- Warning Icon -->
                <div class="ic ic-warning">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M1 21h22L12 2 1 21zm13-3h-2v2h2v-2zm0-4h-2v4h2v-4z"/>
                    </svg>
                </div>
            </div>
            
        </section>

        <section>
            <h2>Network and Connectivity Icons</h2>
            <div class="icon-grid">
                <!-- WiFi Icon -->
                <div class="ic ic-wifi">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M12 20l1.43-1.43c.76-.76.76-2 0-2.76a1.94 1.94 0 0 0-2.76 0c-.76.76-.76 2 0 2.76L12 20zm5.66-5.66L12 16.34 6.34 14.34 7.76 13c2.28-2.28 5.94-2.28 8.22 0l1.42 1.42-1.42 1.42zm4.24-4.24L18 10.58c-4.02-4.02-10.5-4.02-14.52 0l-1.42-1.42C7.68 4.3 16.32 4.3 22.9 9.1z"/>
                    </svg>
                </div>
                <!-- Cloud Icon -->
                <div class="ic ic-cloud">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M19 18H6c-2.21 0-4-1.79-4-4s1.79-4 4-4h1.26A6.007 6.007 0 0 1 12 6c3.31 0 6 2.69 6 6 0 2.21 1.79 4 4 4z"/>
                    </svg>
                </div>
            </div>            
        </section>

        <section>
            <h2>Miscellaneous Icons</h2>
            <div class="icon-grid">
                <!-- Home Icon -->
                <div class="ic ic-home">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                    </svg>
                </div>
                <!-- Microphone Icon -->
                <div class="ic ic-microphone">
                    <svg width="24" height="24" viewBox="0 0 24 24">
                        <path d="M12 14c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3s-3 1.34-3 3v5c0 1.66 1.34 3 3 3zm5-3h-2a5.97 5.97 0 0 1-2.9 4.4V21h2v2h-6v-2h2v-4.6A5.97 5.97 0 0 1 7 11H5c0 3.87 3.13 7 7 7s7-3.13 7-7z"/>
                    </svg>
                </div>
            </div>            
        </section>
    </main>

    <footer>
        <p>&copy; 2024 Font Icon Library. All rights reserved.</p>
    </footer>

    <script src="" async defer></script>
</body>
</html>
